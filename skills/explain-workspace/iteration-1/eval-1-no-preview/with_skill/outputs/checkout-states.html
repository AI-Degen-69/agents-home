<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout state machine (eval-1, no preview)</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;margin:0;background:#0f172a;color:#e2e8f0;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;margin:14px 0}
h1{color:#93c5fd}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>Checkout states</h1>
<div class="card"><b>cart → payment → confirmed.</b> Payment failure returns to cart, never to confirmed.</div>
<svg viewBox="0 0 600 120" width="100%" height="110" role="img" aria-label="state transitions">
<g font-size="12" text-anchor="middle" fill="#fff">
<ellipse cx="90" cy="55" rx="70" ry="30" fill="#1d4ed8"/><text x="90" y="59">cart</text>
<ellipse cx="310" cy="55" rx="70" ry="30" fill="#0e7490"/><text x="310" y="59">payment</text>
<ellipse cx="520" cy="55" rx="70" ry="30" fill="#15803d"/><text x="520" y="59">confirmed</text>
<line x1="160" y1="55" x2="238" y2="55" stroke="#93c5fd" stroke-width="2"/>
<line x1="380" y1="55" x2="448" y2="55" stroke="#93c5fd" stroke-width="2"/>
</g>
</svg>
<p><b>Uncertainty:</b> retry limit on payment failure unknown — assumed 3, confirm per repo.</p>
</main>
</body>
</html>
