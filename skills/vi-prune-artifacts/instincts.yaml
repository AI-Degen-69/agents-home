# Copy-Verify-Delete Relocation

## Action
Relocate with copy-verify-delete and update discovered references, then report old path, new path, and reference updates as table rows.

## Evidence
- Extracted from prune-artifacts skill: rename to <topic>-<date>-<kind>.<ext>, copy, verify integrity, update all inbound links, then delete the original. Always present the move in a verdict table.

