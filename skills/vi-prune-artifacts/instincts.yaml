# Two-Gate Artifact Sweep

## Action
List per-issue artifacts (showcases, ELI5s, plans, drafts) and check each against issue state plus repo-wide reference search before touching anything.

## Evidence
- Extracted from prune-artifacts skill pattern: check tracking issue state (closed/merged) AND verify zero repo-wide references before deletion.
- Prevents premature deletion of active design documents or referenced artifacts.

