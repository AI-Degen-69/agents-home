# Ask Operator For Artifact Home

## Action
Ask the operator which home and naming to use instead of inventing docs/ paths in a repo you have never seen.

## Evidence
- Extracted from prune-artifacts skill: discover repository layout dynamically; never assume or unilaterally invent documentation directory structures.

