# Preserve Dated Finding Reports

## Action
Treat dated finding reports with live conclusions as knowledge regardless of age; never feed them to the obsolescence test.

## Evidence
- Extracted from prune-artifacts skill: dated run/finding reports, architecture decisions, and active conclusions are untouchable knowledge assets. Recency is not staleness.
