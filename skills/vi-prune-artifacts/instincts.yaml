# Keep On Ambiguous Obsolescence

## Action
Keep the file and name the failed check (issue still open, live references, or unproven shipment) rather than deleting on suspicion.

## Evidence
- Extracted from prune-artifacts skill: if either obsolescence gate cannot run (no tracker auth, ambiguous link, live reference hit), preserve the file and document the failed check. Never guess.

